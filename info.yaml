# Tiny Tapeout project information
project:
  title:        "8-bit Shift Register"
  author:       "Lochan Varvinda"
  discord:      ""
  description:  "An 8-bit serial-in parallel-out shift register with reset and shift enable"
  language:     "Verilog"
  clock_hz:     "5000"

  tiles: "1x1"

  top_module:  "tt_um_lochanvarvinda_arch"

  source_files:
